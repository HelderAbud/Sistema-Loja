# Exemplo HA local (2 APIs + nginx) — NÃO é AWS ALB / ECS / EKS.
# Uso: docker compose -f docker-compose.ha.yml up -d --build
# Requer .env com POSTGRES_PASSWORD e LOJAPP_JWT_SECRET (≥32).
# Porta host do proxy: 8088 → http://localhost:8088/actuator/health

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: loja_db
      POSTGRES_USER: loja_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loja_user -d loja_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - lojapp_ha_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api1:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: prod,jsonlogs
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/loja_db
      SPRING_DATASOURCE_USERNAME: loja_user
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      LOJAPP_RATE_LIMIT_MODE: redis
      LOJAPP_JWT_SECRET: ${LOJAPP_JWT_SECRET:?defina LOJAPP_JWT_SECRET}
      LOJAPP_CORS_ORIGINS: ${LOJAPP_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8081/actuator/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 90s

  api2:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: prod,jsonlogs
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/loja_db
      SPRING_DATASOURCE_USERNAME: loja_user
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      LOJAPP_RATE_LIMIT_MODE: redis
      LOJAPP_JWT_SECRET: ${LOJAPP_JWT_SECRET:?defina LOJAPP_JWT_SECRET}
      LOJAPP_CORS_ORIGINS: ${LOJAPP_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8081/actuator/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 90s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8088:80"
    volumes:
      - ./deploy/ha/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy

volumes:
  lojapp_ha_pgdata:
