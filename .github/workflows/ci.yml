name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block committed local artifacts
        run: |
          forbidden_regex='(^|/)node_modules/|(^|/)backup\.sql$|(^|/)frontend/playwright-report/|(^|/)frontend/test-results/'
          if git ls-files | grep -E "$forbidden_regex" >/dev/null; then
            echo "Erro: arquivos/pastas locais não devem ser versionados (node_modules, backup.sql, reports de teste)."
            echo "Remova do git e mantenha no .gitignore."
            exit 1
          fi
          if git ls-files | grep -E '(^|/)\.env$' >/dev/null; then
            echo "Erro: ficheiro .env nao deve ser versionado. Use apenas .env.example sem segredos."
            exit 1
          fi

  backend-unit:
    needs: [repo-hygiene]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run backend unit tests
        run: chmod +x mvnw && ./mvnw -B -Pci-unit-tests test

  backend-integration:
    needs: [repo-hygiene]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run backend integration tests (Docker/Testcontainers)
        run: chmod +x mvnw && ./mvnw -B -Pci-integration-tests test

  frontend:
    needs: [repo-hygiene]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test & build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run test
          npx playwright install --with-deps chromium
          npm run e2e
          npm run build

  frontend-e2e-real:
    needs: [repo-hygiene]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: loja_user
          POSTGRES_PASSWORD: ci_e2e_pass
          POSTGRES_DB: loja_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loja_user -d loja_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/loja_db
      SPRING_DATASOURCE_USERNAME: loja_user
      SPRING_DATASOURCE_PASSWORD: ci_e2e_pass
      LOJAPP_JWT_SECRET: ci-e2e-secret-must-be-32-chars-min!!
      LOJAPP_REGISTRATION_ENABLED: "true"
      LOJAPP_CORS_ORIGINS: http://127.0.0.1:3000
      LOJAPP_RATE_LIMIT_MODE: memory
      E2E_REAL_FLOW: "1"
      E2E_REAL_EMAIL: e2e-ci@lojapp.test
      E2E_REAL_PASSWORD: e2eCiPass1
      E2E_REAL_API_BASE: http://127.0.0.1:8081
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Package API
        run: chmod +x mvnw && ./mvnw -B -DskipTests package
      - name: Start API
        run: |
          nohup java -jar target/lojapp-api-0.0.1-SNAPSHOT.jar > /tmp/lojapp-e2e-api.log 2>&1 &
          echo $! > /tmp/lojapp-e2e-api.pid
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8081/actuator/health >/dev/null; then
              echo "API healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to start"
          tail -n 80 /tmp/lojapp-e2e-api.log
          exit 1
      - name: Register e2e user
        run: |
          curl -sf -X POST http://127.0.0.1:8081/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"e2e-ci@lojapp.test","password":"e2eCiPass1"}'
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Playwright real flow
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e:real

  docker-image:
    needs: [backend-unit, backend-integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t lojapp:ci .
      # CRITICAL + HIGH com fix disponível; CVEs sem patch (só “unfixed”) não bloqueiam o merge.
      - name: Trivy — imagem
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.70.0 image \
            --vuln-type os,library \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress \
            lojapp:ci

  security-fs:
    needs: [repo-hygiene]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy — filesystem (SAST/dependencies/secrets baseline)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            aquasec/trivy:0.70.0 fs \
            --scanners vuln,secret,misconfig \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --ignorefile /src/.trivyignore \
            --skip-files "**/.local-wip/**" \
            --skip-dirs "frontend/node_modules,target,frontend/dist" \
            --exit-code 1 \
            --no-progress \
            /src
