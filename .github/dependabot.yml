# Dependabot — PRs de versão limitados (portfólio: revisão humana)
# Updates: abrir PR mensal (limit 1) por ecossistema; merge só após revisão Helder.
# Alertas de segurança no GitHub Security podem continuar ativos.

version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - maven

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - frontend
