# Dependabot — version updates PAUSADOS (portfólio: autor único Helder Abud).
# PRs automáticos do bot não devem aparecer na lista de ramos.
# Alertas de segurança no GitHub Security podem continuar ativos.
# Updates de dependência: manuais, em branch feat/fix, PR para main.

version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
