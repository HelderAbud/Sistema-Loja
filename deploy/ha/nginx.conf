# Balanceamento round-robin local entre duas réplicas da API LojApp.
# Isto NÃO é AWS ALB / NLB — é nginx num Docker Compose de laboratório.

upstream lojapp_api {
    least_conn;
    server api1:8081;
    server api2:8081;
}

server {
    listen 80;
    server_name localhost;

    location / {
        proxy_pass http://lojapp_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        # Ajuda a ver no curl qual upstream respondeu (lab only)
        add_header X-Lojapp-Upstream $upstream_addr always;
    }
}
